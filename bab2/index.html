    <!-- APLIKASI LENGKAP JAVASCRIPT -->
    <script>
        // Helper aman untuk penyimpanan lokal agar tidak error pada iframe sandbox
        function safeGetStorage(key, fallback) {
            try {
                const val = localStorage.getItem(key);
                return val !== null ? JSON.parse(val) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        function safeSetStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn("Penyimpanan lokal tidak tersedia:", e);
            }
        }

        // Fallback jika SweetAlert2 gagal dimuat dari CDN
        if (typeof window.Swal === 'undefined') {
            window.Swal = {
                fire: function(titleOrOpts, text) {
                    const msg = typeof titleOrOpts === 'object'
                        ? `${titleOrOpts.title || ''}: ${titleOrOpts.text || ''}`
                        : `${titleOrOpts}: ${text || ''}`;
                    console.log(msg);
                    return Promise.resolve({});
                }
            };
        }

        // State Global & Database Cloud (dengan fallback lokal)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'biodiv-explorer';
        let firebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = typeof __firebase_config === 'string'
                    ? JSON.parse(__firebase_config)
                    : __firebase_config;
            }
        } catch (e) {
            console.warn("Konfigurasi Firebase tidak valid, menggunakan mode lokal:", e);
        }

        let db = null;
        let auth = null;
        let currentUser = null;
        let firestoreMod = null;
        window.allStudentsScores = safeGetStorage('biodiv_recap_scores', []);
        window.isTeacherMode = false;

        // Inisialisasi Firebase secara dinamis agar tidak memblokir fungsi navigasi utama
        async function initFirebase() {
            if (!firebaseConfig) return;
            try {
                const appMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const authMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                firestoreMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

                const app = appMod.initializeApp(firebaseConfig);
                db = firestoreMod.getFirestore(app);
                auth = authMod.getAuth(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await authMod.signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await authMod.signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                listenToScores();
            } catch (e) {
                console.warn("Mode offline/lokal aktif (Cloud tidak terhubung):", e);
            }
        }

        function listenToScores() {
            if (!currentUser || !db || !firestoreMod) return;
            const scoresRef = firestoreMod.collection(db, 'artifacts', appId, 'public', 'data', 'student_scores');
            firestoreMod.onSnapshot(scoresRef, (snapshot) => {
                window.allStudentsScores = [];
                snapshot.forEach((docSnap) => {
                    window.allStudentsScores.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.allStudentsScores.sort((a, b) => b.totalSkor - a.totalSkor);
                safeSetStorage('biodiv_recap_scores', window.allStudentsScores);
                if (window.currentScreen === 'recap') {
                    window.renderRecapTable();
                }
            }, (error) => console.error("Sync error:", error));
        }

        window.submitToCloud = async function() {
            const nameInput = document.getElementById('student-name-input');
            const studentName = nameInput ? nameInput.value : '';
            if (!studentName.trim()) {
                Swal.fire('Oops', 'Mohon masukkan nama kamu terlebih dahulu!', 'warning');
                return;
            }

            const totalPertanyaan = 65; // (9 modul x 5 soal) + 20 soal evaluasi
            let totalBenar = state.evalScore || 0;
            let detailModul = {};

            for (let i = 1; i <= 9; i++) {
                const s = state.moduleScores[i] || 0;
                totalBenar += s;
                detailModul[`M${i}`] = s;
            }

            const skor100 = Math.round((totalBenar / totalPertanyaan) * 100);
            const recordId = currentUser ? currentUser.uid : ('local_' + studentName.trim().toLowerCase().replace(/\s+/g, '_'));

            const scoreData = {
                nama: studentName.trim(),
                totalBenar: totalBenar,
                totalSkor: skor100,
                modul: detailModul,
                evaluasi: state.evalScore || 0,
                timestamp: new Date().toISOString()
            };

            // Jika Cloud aktif, kirim ke Firestore
            if (currentUser && db && firestoreMod) {
                try {
                    const docRef = firestoreMod.doc(db, 'artifacts', appId, 'public', 'data', 'student_scores', recordId);
                    await firestoreMod.setDoc(docRef, scoreData);
                    Swal.fire('Terkirim!', 'Nilaimu berhasil disinkronkan ke Tabel Rekap Kelas.', 'success');
                    return;
                } catch (e) {
                    console.error("Gagal kirim ke cloud, beralih ke penyimpanan lokal:", e);
                }
            }

            // Fallback penyimpanan lokal jika cloud tidak terhubung
            const existingIdx = window.allStudentsScores.findIndex(item => item.id === recordId);
            if (existingIdx >= 0) {
                window.allStudentsScores[existingIdx] = { id: recordId, ...scoreData };
            } else {
                window.allStudentsScores.push({ id: recordId, ...scoreData });
            }
            window.allStudentsScores.sort((a, b) => b.totalSkor - a.totalSkor);
            safeSetStorage('biodiv_recap_scores', window.allStudentsScores);
            window.renderRecapTable();
            Swal.fire('Tersimpan!', 'Nilaimu berhasil disimpan ke Tabel Rekap Kelas.', 'success');
        };

        // Fungsi Mode Guru: Aktifkan / Nonaktifkan Edit
        window.toggleTeacherMode = async function() {
            if (!window.isTeacherMode) {
                const { value: pin } = await Swal.fire({
                    title: 'Akses Mode Guru',
                    input: 'password',
                    inputLabel: 'Masukkan PIN Guru (Default: 1234)',
                    inputPlaceholder: 'Masukkan PIN...',
                    showCancelButton: true,
                    confirmButtonColor: '#16a34a'
                });
                if (pin === '1234') {
                    window.isTeacherMode = true;
                    Swal.fire('Berhasil', 'Mode Guru aktif! Anda dapat mengedit nilai langsung di tabel.', 'success');
                    window.renderRecapTable();
                } else if (pin !== undefined) {
                    Swal.fire('Salah', 'PIN Guru tidak sesuai.', 'error');
                }
            } else {
                window.isTeacherMode = false;
                window.renderRecapTable();
            }
        };

        // Fungsi Edit Nilai Siswa oleh Guru (Sinkron ke Cloud / Lokal)
        window.editStudentScore = async function(studentId, studentName, currentScore) {
            const { value: newScore, isDenied } = await Swal.fire({
                title: `Edit Nilai: ${studentName}`,
                input: 'number',
                inputLabel: 'Masukkan Nilai Akhir Baru (0 - 100)',
                inputValue: currentScore,
                inputAttributes: { min: 0, max: 100, step: 1 },
                showCancelButton: true,
                showDenyButton: true,
                confirmButtonText: 'Simpan Perubahan',
                denyButtonText: 'Hapus Data',
                confirmButtonColor: '#16a34a',
                denyButtonColor: '#dc2626'
            });

            if (isDenied) {
                if (db && firestoreMod) {
                    try {
                        const docRef = firestoreMod.doc(db, 'artifacts', appId, 'public', 'data', 'student_scores', studentId);
                        await firestoreMod.deleteDoc(docRef);
                        Swal.fire('Terhapus', `Data nilai ${studentName} telah dihapus.`, 'success');
                        return;
                    } catch (e) {
                        console.error(e);
                    }
                }
                window.allStudentsScores = window.allStudentsScores.filter(s => s.id !== studentId);
                safeSetStorage('biodiv_recap_scores', window.allStudentsScores);
                window.renderRecapTable();
                Swal.fire('Terhapus', `Data nilai ${studentName} telah dihapus.`, 'success');
                return;
            }

            if (newScore !== undefined && newScore !== '') {
                const parsedScore = Math.max(0, Math.min(100, parseInt(newScore, 10)));
                if (isNaN(parsedScore)) {
                    Swal.fire('Tidak Valid', 'Masukkan angka nilai yang valid (0-100).', 'warning');
                    return;
                }
                if (db && firestoreMod) {
                    try {
                        const docRef = firestoreMod.doc(db, 'artifacts', appId, 'public', 'data', 'student_scores', studentId);
                        await firestoreMod.updateDoc(docRef, {
                            totalSkor: parsedScore,
                            timestamp: new Date().toISOString()
                        });
                        Swal.fire('Tersimpan', `Nilai ${studentName} diperbarui menjadi ${parsedScore}.`, 'success');
                        return;
                    } catch (e) {
                        console.error(e);
                    }
                }
                const target = window.allStudentsScores.find(s => s.id === studentId);
                if (target) {
                    target.totalSkor = parsedScore;
                    target.timestamp = new Date().toISOString();
                    window.allStudentsScores.sort((a, b) => b.totalSkor - a.totalSkor);
                    safeSetStorage('biodiv_recap_scores', window.allStudentsScores);
                    window.renderRecapTable();
                }
                Swal.fire('Tersimpan', `Nilai ${studentName} diperbarui menjadi ${parsedScore}.`, 'success');
            }
        };

        // Fungsi Export ke Excel / Google Sheets (Rapi per Kolom)
        window.exportToCSV = function() {
            if (window.allStudentsScores.length === 0) {
                Swal.fire('Kosong', 'Belum ada data nilai untuk diunduh.', 'info');
                return;
            }
            
            let tableHtml = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head><meta charset="utf-8"></head>
                <body>
                    <table border="1">
                        <thead>
                            <tr style="background-color: #166534; color: #ffffff; font-weight: bold;">
                                <th>Rank</th>
                                <th>Nama Siswa</th>
                                <th>Nilai Akhir (Skala 100)</th>
                                <th>Modul 1</th>
                                <th>Modul 2</th>
                                <th>Modul 3</th>
                                <th>Modul 4</th>
                                <th>Modul 5</th>
                                <th>Modul 6</th>
                                <th>Modul 7</th>
                                <th>Modul 8</th>
                                <th>Modul 9</th>
                                <th>Evaluasi (Max 20)</th>
                                <th>Waktu Sinkronisasi</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            window.allStudentsScores.forEach((s, idx) => {
                const m = s.modul || {};
                tableHtml += `
                    <tr>
                        <td align="center">${idx + 1}</td>
                        <td>${s.nama}</td>
                        <td align="center" style="font-weight: bold; background-color: #dcfce7;">${s.totalSkor}</td>
                        <td align="center">${m.M1 ?? 0}</td>
                        <td align="center">${m.M2 ?? 0}</td>
                        <td align="center">${m.M3 ?? 0}</td>
                        <td align="center">${m.M4 ?? 0}</td>
                        <td align="center">${m.M5 ?? 0}</td>
                        <td align="center">${m.M6 ?? 0}</td>
                        <td align="center">${m.M7 ?? 0}</td>
                        <td align="center">${m.M8 ?? 0}</td>
                        <td align="center">${m.M9 ?? 0}</td>
                        <td align="center">${s.evaluasi ?? 0}</td>
                        <td align="center">${new Date(s.timestamp).toLocaleString('id-ID')}</td>
                    </tr>
                `;
            });

            tableHtml += `
                        </tbody>
                    </table>
                </body>
                </html>
            `;

            const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Rekap_Nilai_Biosfer_Kelas_XI.xls");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // --- 1. DATA MATERI ---
        const modulesData = [
            {
                id: 1,
                title: "Mengenal Biosfer",
                icon: "fa-globe",
                summary: "Pengertian biosfer, karakteristik, dan hubungannya dengan geosfer lainnya.",
                pemantik: "Pernahkah kamu berpikir, mengapa kehidupan hanya ditemukan di Bumi dan terkonsentrasi di lapisan tipis tertentu?",
                content: `
                    <h3 class="text-2xl font-bold text-eco-800 mb-4">Apa itu Biosfer?</h3>
                    <p class="mb-4 text-gray-700 leading-relaxed">Biosfer berasal dari kata <i>bios</i> (hidup) dan <i>sphaira</i> (lapisan). Secara harfiah, biosfer adalah lapisan tempat makhluk hidup bernaung. Biosfer bukan hanya tentang makhluk hidupnya saja, tetapi juga interaksinya dengan lingkungan fisik bumi (litosfer, hidrosfer, dan atmosfer).</p>
                    <div class="bg-eco-50 border-l-4 border-eco-500 p-4 mb-6 rounded-r">
                        <strong>Fakta Unik:</strong> Jika bumi diibaratkan sebuah apel, biosfer hanyalah setipis kulit apel tersebut!
                    </div>
                    <h3 class="text-xl font-bold text-eco-800 mb-3">Interaksi Antarlapisan Geosfer</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-center">
                        <div class="bg-white p-4 rounded shadow">
                            <i class="fa-solid fa-cloud text-blue-400 text-3xl mb-2"></i>
                            <h4 class="font-bold">Atmosfer</h4>
                            <p class="text-sm">Menyediakan oksigen dan pelindung radiasi.</p>
                        </div>
                        <div class="bg-white p-4 rounded shadow">
                            <i class="fa-solid fa-water text-ocean-500 text-3xl mb-2"></i>
                            <h4 class="font-bold">Hidrosfer</h4>
                            <p class="text-sm">Sumber air utama bagi seluruh kehidupan.</p>
                        </div>
                        <div class="bg-white p-4 rounded shadow">
                            <i class="fa-solid fa-mountain text-stone-600 text-3xl mb-2"></i>
                            <h4 class="font-bold">Litosfer</h4>
                            <p class="text-sm">Tempat berpijak dan penyedia mineral (tanah).</p>
                        </div>
                    </div>
                    <img src="https://placehold.co/800x400/22c55e/ffffff?text=Ilustrasi+Sistem+Biosfer" alt="Biosfer" class="w-full rounded-lg shadow-md mb-4">
                `
            },
            {
                id: 2,
                title: "Faktor Persebaran",
                icon: "fa-cloud-sun-rain",
                summary: "Faktor iklim, edafik, relief, dan biotik yang memengaruhi flora fauna.",
                pemantik: "Mengapa pohon kurma tidak tumbuh di pegunungan bersalju? Apa yang menghalanginya?",
                content: `
                    <h3 class="text-2xl font-bold text-eco-800 mb-4">Mengapa Flora dan Fauna Berbeda-beda?</h3>
                    <p class="mb-4">Persebaran makhluk hidup di muka bumi tidak merata. Hal ini dikendalikan oleh beberapa faktor utama:</p>
                    <ul class="space-y-4 mb-6">
                        <li class="bg-white p-4 rounded shadow border-t-2 border-blue-400">
                            <strong>1. Faktor Iklim (Klimatik)</strong>: Suhu, curah hujan, kelembapan, dan intensitas sinar matahari. Ini adalah faktor paling dominan.
                        </li>
                        <li class="bg-white p-4 rounded shadow border-t-2 border-amber-600">
                            <strong>2. Faktor Tanah (Edafik)</strong>: Tingkat kesuburan tanah, tekstur, struktur, dan pH tanah sangat menentukan vegetasi yang dapat tumbuh.
                        </li>
                        <li class="bg-white p-4 rounded shadow border-t-2 border-stone-500">
                            <strong>3. Faktor Topografi (Relief)</strong>: Ketinggian tempat (elevasi) dan kemiringan lereng memengaruhi suhu dan kelembapan.
                        </li>
                        <li class="bg-white p-4 rounded shadow border-t-2 border-eco-500">
                            <strong>4. Faktor Biotik (Biologis) & Manusia</strong>: Peran makhluk hidup lain, terutama aktivitas manusia (seperti deforestasi), yang dapat menyebarkan atau memusnahkan flora dan fauna.
                        </li>
                        <li class="bg-white p-4 rounded shadow border-t-2 border-purple-500">
                            <strong>5. Faktor Geologis</strong>: Sejarah perkembangan bumi, seperti pergeseran benua yang memisahkan populasi spesies masa lalu.
                        </li>
                    </ul>
                    <div class="text-center mt-6">
                        <button onclick="navigate('simulation', 'climate')" class="bg-eco-600 text-white px-6 py-3 rounded-full font-bold hover:bg-eco-700 transition shadow-lg">
                            <i class="fa-solid fa-flask mr-2"></i> Buka Simulasi Iklim & Bioma
                        </button>
                    </div>
                `
            },
            {
                id: 3,
                title: "Bioma di Dunia",
                icon: "fa-earth-americas",
                summary: "Karakteristik 8 bioma utama di bumi beserta flora dan faunanya.",
                pemantik: "Jika kamu berada di gurun pasir yang terik, adaptasi seperti apa yang harus dimiliki tumbuhan agar tidak mati kekeringan?",
                content: `
                    <h3 class="text-2xl font-bold text-eco-800 mb-4">8 Bioma Utama di Permukaan Bumi</h3>
                    <p class="mb-4">Bioma adalah wilayah ekologi yang luas dengan iklim, flora, dan fauna yang khas. Ayo kenali 8 bioma di dunia!</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-green-600 hover:shadow-lg transition">
                            <img src="https://placehold.co/600x200/166534/ffffff?text=Hutan+Hujan+Tropis" class="w-full h-24 object-cover">

        // Global functions for quiz logic to bypass inline string closure issues
        window.loadQuestion = function() {
            const q = window.currentQuizQuestions[window.currentQuizIndex];
            document.getElementById('q-counter').innerText = (window.currentQuizIndex + 1);
            
            let optionsHtml = q.options.map((opt, i) => `

            document.getElementById('quiz-body').innerHTML = `
                <h4 class="text-xl font-bold text-gray-800 mb-6">${q.q}</h4>
                <div class="space-y-2">
                    ${optionsHtml}
                </div>
            `;
        };

        window.checkAnswer = function(selectedIndex) {
            const q = window.currentQuizQuestions[window.currentQuizIndex];
            const isCorrect = (selectedIndex === q.a);
            
            if(isCorrect) {

                Swal.fire({ icon: 'success', title: 'Benar!', text: 'Jawaban kamu tepat.', timer: 1500, showConfirmButton: false });

            window.currentQuizIndex++;
            if(window.currentQuizIndex < window.currentQuizQuestions.length) {
                setTimeout(() => window.loadQuestion(), 1600);

            }

        function bindSimulationEvents() {
            // Indonesia Map Logic
            const asiatis = document.getElementById('reg-asiatis');
            const peralihan = document.getElementById('reg-peralihan');
            const australis = document.getElementById('reg-australis');
            const infoPanel = document.getElementById('map-info');
            const infoTitle = document.getElementById('info-title');
            const infoDesc = document.getElementById('info-desc');

            const mapData = {
                asiatis: { title: "Zona Asiatis (Barat)", desc: "Fauna mamalia besar (Gajah, Harimau, Badak, Orangutan). Flora dominan Hutan Hujan Tropis (Meranti, Rafflesia)." },
                peralihan: { title: "Zona Peralihan (Tengah)", desc: "Fauna endemik (Komodo, Anoa, Babirusa). Flora Hutan Musim & Sabana (Cendana, Eboni)." },
                australis: { title: "Zona Australis (Timur)", desc: "Mamalia berkantung & burung eksotis (Kasuari, Cenderawasih, Kanguru Pohon). Flora khas Hutan Hujan & Pegunungan (Matoa)." }
            };

            const showInfo = (key) => {
                if(!infoPanel) return;
                infoPanel.classList.remove('hidden');
                infoTitle.innerText = mapData[key].title;
                infoDesc.innerText = mapData[key].desc;
            };

            if(asiatis) asiatis.addEventListener('mouseover', () => showInfo('asiatis'));
            if(peralihan) peralihan.addEventListener('mouseover', () => showInfo('peralihan'));
            if(australis) australis.addEventListener('mouseover', () => showInfo('australis'));

            // Climate Simulator Logic
            const simTemp = document.getElementById('sim-temp');
            const simRain = document.getElementById('sim-rain');
            const tempVal = document.getElementById('temp-val');
            const rainVal = document.getElementById('rain-val');
            const biomeName = document.getElementById('biome-name');
            const biomeDesc = document.getElementById('biome-desc');
            const biomeImg = document.getElementById('biome-img');

            if(simTemp && simRain) {
                const updateBiome = () => {
                    const t = parseInt(simTemp.value);
                    const r = parseInt(simRain.value);
                    tempVal.innerText = t;
                    rainVal.innerText = r;

                    let name = "", desc = "", img = "";

                    if (r < 250) {
                        if (t > 15) { name = "Gurun Panas"; desc = "Sangat kering, vegetasi xerofit (Kaktus). Fauna nokturnal."; img = "d97706/ffffff?text=Gurun"; }
                        else { name = "Tundra / Gurun Dingin"; desc = "Sangat dingin dan kering. Permafrost, hanya lumut."; img = "cbd5e1/1e293b?text=Tundra"; }
                    } else if (r >= 250 && r < 1000) {
                        if (t > 15) { name = "Sabana / Padang Rumput Tropis"; desc = "Rumput dengan pohon tersebar. Zebra, Singa."; img = "84cc16/ffffff?text=Sabana"; }
                        else { name = "Stepa / Padang Rumput Iklim Sedang"; desc = "Padang rumput luas tanpa pohon. Bison, Kuda liar."; img = "a3e635/1e293b?text=Stepa"; }
                    } else if (r >= 1000 && r < 2000) {
                        if (t > 15) { name = "Hutan Musim Tropis"; desc = "Pohon meranggas saat kemarau (Jati)."; img = "65a30d/ffffff?text=Hutan+Musim"; }
                        else if (t > 0) { name = "Hutan Gugur Iklim Sedang"; desc = "Daun berguguran di musim gugur. Empat musim."; img = "ea580c/ffffff?text=Hutan+Gugur"; }
                        else { name = "Taiga (Hutan Konifer)"; desc = "Hutan pinus berdaun jarum. Musim dingin panjang."; img = "14532d/ffffff?text=Taiga"; }
                    } else {
                        if (t > 18) { name = "Hutan Hujan Tropis"; desc = "Curah hujan sangat tinggi, selalu hijau, kanopi rapat. Biodiversitas sangat tinggi."; img = "166534/ffffff?text=Hutan+Hujan+Tropis"; }
                        else { name = "Hutan Hujan Sedang (Temperate)"; desc = "Hujan lebat tapi iklim lebih sejuk. Pohon besar berlumut."; img = "15803d/ffffff?text=Hutan+Hujan+Sedang"; }
                    }

                    biomeName.innerText = name;
                    biomeDesc.innerText = desc;
                    biomeImg.src = `https://placehold.co/800x400/${img}`;
                };

                simTemp.addEventListener('input', updateBiome);
                simRain.addEventListener('input', updateBiome);
            }
            
            // Deforestation Simulator Logic
            const simDef = document.getElementById('sim-def');
            const defVal = document.getElementById('def-val');
            const defStatus = document.getElementById('def-status');
            const defPop = document.getElementById('def-pop');
            const defVisual = document.getElementById('def-visual');
            const defIcon = document.getElementById('def-icon');
            const defDesc = document.getElementById('def-desc');
            const defInfo = document.getElementById('def-info');

            if(simDef) {
                simDef.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    defVal.innerText = val;
                    
                    // Simple non-linear calculation for population drop
                    let pop = 100 - (val * 1.3);
                    if(pop < 0) pop = 0;
                    
                    defPop.innerText = Math.round(pop) + '%';
                    defVisual.style.width = (100 - val) + '%';
                    
                    if(val >= 80) {
                        defVisual.style.backgroundColor = '#b91c1c'; // Red
                        defStatus.innerText = 'Kritis / Punah Lokal';
                        defStatus.className = 'text-red-700 font-bold';
                        defPop.className = 'font-bold text-xl text-red-700';
                        defIcon.className = 'fa-solid fa-skull-crossbones text-7xl text-red-700';
                        defDesc.innerText = 'Habitat Hancur';
                        defInfo.innerText = 'Tidak ada ruang jelajah tersisa. Populasi satwa endemik musnah atau terpaksa masuk ke permukiman.';
                    } else if(val >= 40) {
                        defVisual.style.backgroundColor = '#eab308'; // Yellow
                        defStatus.innerText = 'Terancam / Terfragmentasi';
                        defStatus.className = 'text-yellow-600 font-bold';
                        defPop.className = 'font-bold text-xl text-yellow-600';
                        defIcon.className = 'fa-solid fa-triangle-exclamation text-7xl text-yellow-600';
                        defDesc.innerText = 'Hutan Terfragmentasi';
                        defInfo.innerText = 'Habitat terpecah belah. Jalur migrasi terputus dan ketersediaan pakan mulai menipis drastis.';
                    } else {
                        defVisual.style.backgroundColor = '#22c55e'; // Green
                        defStatus.innerText = 'Utuh / Seimbang';
                        defStatus.className = 'text-green-600 font-bold';
                        defPop.className = 'font-bold text-xl text-green-600';
                        defIcon.className = 'fa-solid fa-tree text-7xl text-green-700';
                        defDesc.innerText = 'Hutan Lebat Terjaga';
                        defInfo.innerText = 'Satwa memiliki ruang jelajah dan sumber pakan yang luas.';
                    }
                });
            }
        }

        function renderEvaluation() {
            // State for evaluation
            window.evalIndex = 0;
            window.evalScore = 0;
            window.evalAnswers = [];
            const totalEval = evaluationQuestions.length;

            let btnHtml = evaluationQuestions.map((q, i) => `
                <div class="hidden" id="eval-q-${i}">
                    <div class="mb-4">
                        <span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">Evaluasi Akhir : Soal ${i+1}/${totalEval}</span>
                    </div>
                    <h4 class="text-xl font-bold text-gray-800 mb-6">${q.q}</h4>
                    <div class="space-y-3">
                        ${q.options.map((opt, optIdx) => `
                            <button onclick="window.answerEval(${i}, ${optIdx})" class="w-full text-left p-4 border border-gray-300 rounded-lg hover:bg-red-50 hover:border-red-500 transition duration-200">
                                ${String.fromCharCode(65 + optIdx)}. ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            return `
                <div class="max-w-3xl mx-auto px-4 py-12 w-full">
                    <div class="bg-white rounded-xl shadow-xl p-8 border-t-8 border-red-600 relative min-h-[400px]">
                        <div id="eval-intro" class="text-center">
                            <i class="fa-solid fa-file-signature text-6xl text-red-500 mb-4"></i>
                            <h2 class="text-3xl font-bold mb-4">Evaluasi Pembelajaran</h2>
                            <p class="text-gray-600 mb-8">Uji pemahaman mendalam kamu mengenai Biosfer dan Keanekaragaman Hayati. Terdapat ${totalEval} soal pilihan ganda.</p>
                            <button onclick="window.startEval()" class="bg-red-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-red-700 transition">
                                Mulai Evaluasi
                            </button>
                        </div>
                        
                        <div id="eval-questions-container">
                            ${btnHtml}
                        </div>
                        
                        <div id="eval-result" class="hidden text-center">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            `;
        }

        window.startEval = function() {
            document.getElementById('eval-intro').classList.add('hidden');
            document.getElementById('eval-q-0').classList.remove('hidden');
        };

        window.answerEval = function(qIndex, selectedIdx) {
            window.evalAnswers[qIndex] = selectedIdx;
            
            // Check if correct
            if(selectedIdx === evaluationQuestions[qIndex].a) {
                window.evalScore++;
            }

            document.getElementById(`eval-q-${qIndex}`).classList.add('hidden');
            
            if(qIndex + 1 < evaluationQuestions.length) {
                document.getElementById(`eval-q-${qIndex + 1}`).classList.remove('hidden');
            } else {
                window.finishEval();
            }
        };

        window.finishEval = function() {
            const total = evaluationQuestions.length;
            const scorePercent = (window.evalScore / total) * 100;
            const resContainer = document.getElementById('eval-result');
            resContainer.classList.remove('hidden');
            
            // Simpan skor evaluasi
            state.evalScore = window.evalScore;
            safeSetStorage('biodiv_eval_score', state.evalScore);

            let feedback = "";
            if (scorePercent >= 80) feedback = "Luar biasa! Pemahaman konsep geografismu sangat baik.";
            else if (scorePercent >= 60) feedback = "Cukup baik, namun masih perlu meninjau ulang materi spesifik.";
            else feedback = "Jangan putus asa! Mari pelajari kembali modul-modul sebelumnya.";

            resContainer.innerHTML = `
                <div class="text-6xl mb-4 ${scorePercent >= 60 ? 'text-eco-500' : 'text-amber-500'}">
                    <i class="fa-solid ${scorePercent >= 80 ? 'fa-medal' : 'fa-star-half-stroke'}"></i>
                </div>
                <h3 class="text-3xl font-bold mb-2">Nilai Akhir: ${scorePercent}</h3>
                <p class="text-gray-600 mb-6 font-medium">${window.evalScore} Benar dari ${total} Soal</p>
                <div class="bg-gray-100 p-4 rounded-lg mb-6 text-left">
                    <p class="text-sm text-gray-800 italic">"${feedback}"</p>
                </div>
                <button onclick="navigate('dashboard')" class="bg-slate-800 text-white px-6 py-2 rounded-full font-bold hover:bg-slate-700 transition">Kembali ke Dashboard</button>
            `;

            if(scorePercent >= 60) {
                updateScore(100); // Bonus score
            }
        };

        function renderRecapPage() {
            // Hitung total skor sementara dari perangkat ini
            let totalBenarLokal = state.evalScore || 0;
            for(let i=1; i<=9; i++) totalBenarLokal += (state.moduleScores[i] || 0);
            let skorMaksimum100 = Math.round((totalBenarLokal / 65) * 100);

            return `
                <div class="max-w-7xl mx-auto px-4 py-8 w-full">
                    <h2 class="text-3xl font-bold text-eco-900 mb-2"><i class="fa-solid fa-table-list mr-2"></i> Sinkronisasi & Rekap Nilai</h2>
                    <p class="text-gray-600 mb-8">Papan peringkat dan rekap nilai yang terhubung langsung ke Server Kelas (Cloud).</p>
                    
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden mb-8">
                        <div class="bg-eco-600 p-4 text-white">
                            <h3 class="font-bold text-lg">Kirim Nilai Kamu</h3>
                        </div>
                        <div class="p-6 flex flex-col md:flex-row items-center gap-6">
                            <div class="flex-1">
                                <p class="text-sm text-gray-500 mb-1">Skor Tertinggimu Saat Ini (Skala 100):</p>
                                <div class="text-4xl font-extrabold text-eco-600">${skorMaksimum100} <span class="text-lg text-gray-400">/ 100</span></div>
                                <p class="text-xs text-gray-400 mt-2">Dari ${totalBenarLokal} jawaban benar dari total 65 pertanyaan.</p>
                            </div>
                            <div class="flex-1 w-full">
                                <input type="text" id="student-name-input" placeholder="Masukkan Nama Lengkapmu..." class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-eco-500 mb-2">
                                <button onclick="window.submitToCloud()" class="w-full bg-ocean-600 hover:bg-ocean-700 text-white font-bold py-3 rounded-lg shadow transition">
                                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Sinkronkan ke Tabel Rekap
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                        <div class="bg-slate-800 p-4 text-white flex flex-wrap justify-between items-center gap-3">
                            <div>
                                <h3 class="font-bold text-lg"><i class="fa-solid fa-users mr-2"></i> Tabel Rekap Kelas (Live Sheet)</h3>
                                <span class="text-xs text-slate-300">Tersinkronisasi otomatis secara real-time</span>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="window.toggleTeacherMode()" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-2 rounded shadow transition">
                                    <i class="fa-solid fa-user-tie mr-1"></i> <span id="teacher-mode-label">Mode Guru (Edit)</span>
                                </button>
                                <button onclick="window.exportToCSV()" class="text-xs bg-green-600 hover:bg-green-500 text-white font-bold px-3 py-2 rounded shadow transition">
                                    <i class="fa-solid fa-file-excel mr-1"></i> Unduh Excel / Google Sheets
                                </button>
                            </div>
                        </div>
                        <div class="overflow-x-auto p-4" id="recap-table-container">
                            <div class="text-center text-gray-500 py-8"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><br>Memuat data dari server...</div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.renderRecapTable = function() {
            const container = document.getElementById('recap-table-container');
            const labelBtn = document.getElementById('teacher-mode-label');
            if(labelBtn) labelBtn.innerText = window.isTeacherMode ? 'Keluar Mode Guru' : 'Mode Guru (Edit)';
            if(!container) return;

            if(window.allStudentsScores.length === 0) {
                container.innerHTML = `<div class="text-center text-gray-500 py-8">Belum ada data nilai siswa yang disinkronkan.</div>`;
                return;
            }

            let rows = window.allStudentsScores.map((s, index) => {
                let modCells = '';
                for(let i=1; i<=9; i++) {
                    modCells += `<td class="py-2 px-3 border-b text-center text-sm">${s.modul && s.modul[`M${i}`] !== undefined ? s.modul[`M${i}`] : '-'}</td>`;
                }
                
                let actionCell = window.isTeacherMode ? `
                    <td class="py-2 px-3 border-b text-center">
                        <button onclick="window.editStudentScore('${s.id}', '${s.nama.replace(/'/g, "\\'")}', ${s.totalSkor})" class="bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white px-2 py-1 rounded text-xs font-bold transition">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                    </td>
                ` : '';

                return `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="py-2 px-3 border-b text-center font-bold">${index + 1}</td>
                        <td class="py-2 px-3 border-b font-medium">${s.nama}</td>
                        <td class="py-2 px-3 border-b text-center font-bold text-eco-600 bg-eco-50">${s.totalSkor}</td>
                        ${modCells}
                        <td class="py-2 px-3 border-b text-center font-bold text-ocean-600">${s.evaluasi || '-'}</td>
                        <td class="py-2 px-3 border-b text-center text-xs text-gray-400">${new Date(s.timestamp).toLocaleTimeString()}</td>
                        ${actionCell}
                    </tr>
                `;
            }).join('');

            container.innerHTML = `
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-sm">
                            <th class="py-2 px-3 border-b text-center">Rank</th>
                            <th class="py-2 px-3 border-b">Nama Siswa</th>
                            <th class="py-2 px-3 border-b text-center bg-eco-100">Nilai Akhir (100)</th>
                            <th class="py-2 px-3 border-b text-center" colspan="9">Skor Modul (Max 5)</th>
                            <th class="py-2 px-3 border-b text-center">Evaluasi (Max 20)</th>
                            <th class="py-2 px-3 border-b text-center">Waktu Sync</th>
                            ${window.isTeacherMode ? '<th class="py-2 px-3 border-b text-center bg-amber-100">Aksi Guru</th>' : ''}
                        </tr>
                        <tr class="bg-gray-50 text-gray-500 text-xs text-center">
                            <th></th><th></th><th></th>
                            <th>M1</th><th>M2</th><th>M3</th><th>M4</th><th>M5</th><th>M6</th><th>M7</th><th>M8</th><th>M9</th>
                            <th></th><th></th>
                            ${window.isTeacherMode ? '<th></th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
            `;
        }

        function renderProject() {
            return `
                <div class="max-w-4xl mx-auto px-4 py-12 w-full">
                    <div class="bg-white rounded-xl shadow-xl overflow-hidden">
                        <div class="bg-ocean-600 p-8 text-white text-center">
                            <h2 class="text-3xl font-bold mb-2">Projek Kolaboratif</h2>
                            <p class="text-ocean-100 uppercase tracking-wide">Ekspedisi Keanekaragaman Hayati Lingkungan Sekitar</p>
                        </div>
                        <div class="p-8 text-gray-800">
                            <h3 class="text-xl font-bold mb-4 text-ocean-800"><i class="fa-solid fa-list-check mr-2"></i>Tugas Kamu (Individu / Kelompok):</h3>
                            <ol class="list-decimal pl-6 space-y-3 mb-6 bg-ocean-50 p-4 rounded-lg border border-ocean-100">
                                <li><strong>Observasi:</strong> Identifikasi minimal 5 jenis flora dan 3 fauna di lingkungan sekitar rumah atau sekolahmu.</li>
                                <li><strong>Dokumentasi:</strong> Ambil foto langsung objek tersebut.</li>
                                <li><strong>Analisis:</strong> Cari nama ilmiahnya, klasifikasikan jenisnya, dan catat kondisi habitatnya.</li>
                                <li><strong>Evaluasi Ancaman:</strong> Analisis apakah ada ancaman terhadap mereka (misal: sampah, polusi, penebangan).</li>
                                <li><strong>Karya Digital:</strong> Buat infografis sederhana berisi temuanmu dan solusi pelestariannya.</li>
                            </ol>
                            
                            <div class="bg-white border-2 border-dashed border-gray-300 rounded-xl p-6 text-center">
                                <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 mb-3"></i>
                                <h4 class="font-bold text-gray-700">Kumpulkan Hasil Projek</h4>
                                <p class="text-sm text-gray-500 mb-4">Serahkan file infografis (PDF/JPG) atau link ke guru Geografi-mu.</p>
                                <button onclick="Swal.fire('Fitur Pengumpulan','Dalam versi simulasi ini, karya diserahkan secara manual ke guru di kelas. Terus berkarya!','info')" class="bg-ocean-500 hover:bg-ocean-600 text-white font-bold py-2 px-6 rounded-full transition">Upload Karya</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Mobile Menu Toggle
        document.getElementById('mobile-menu-btn').addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // Initialize Score Display, Load Home & Connect Firebase
        document.getElementById('nav-score').innerText = state.score + " Poin";
        window.navigate('home');
        initFirebase();

    </script>
</body>
</html>
