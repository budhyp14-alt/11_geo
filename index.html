<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pembelajaran Geografi Kelas 11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-center items-center p-6 text-slate-800">

    <main class="max-w-4xl w-full text-center space-y-8">
        <!-- Judul Portal -->
        <div class="space-y-3">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                Modul Geografi Kelas 11
            </h1>
            <p class="text-slate-600 text-base sm:text-lg">
                Daftar menu materi pembelajaran. Silakan klik tombol di bawah untuk membuka modul.
            </p>
        </div>

        <!-- Daftar Kotak Menu TP -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left pt-4">
            
            <!-- Kotak Tujuan Pembelajaran 2.1 (Aktif) -->
            <a href="/tp2-1" class="group bg-white p-7 rounded-2xl border-2 border-blue-500 shadow-md hover:shadow-xl hover:bg-blue-50/40 transition-all flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-blue-600 group-hover:text-blue-700">
                        Tujuan Pembelajaran 2.1
                    </h2>
                    <p class="text-slate-500 text-sm mt-1">
                        Bab 2: Faktor Persebaran Flora & Fauna
                    </p>
                </div>
                <span class="text-blue-600 text-2xl font-bold group-hover:translate-x-1 transition-transform">
                    &rarr;
                </span>
            </a>

            <!-- Kotak Tujuan Pembelajaran 2.2 (Sekarang Aktif & Bisa Diklik) -->
            <a href="/tp2-2" class="group bg-white p-7 rounded-2xl border-2 border-blue-500 shadow-md hover:shadow-xl hover:bg-blue-50/40 transition-all flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-blue-600 group-hover:text-blue-700">
                        Tujuan Pembelajaran 2.2
                    </h2>
                    <p class="text-slate-500 text-sm mt-1">
                        Bab 2: Karakteristik Bioma Terestrial Dunia
                    </p>
                </div>
                <span class="text-blue-600 text-2xl font-bold group-hover:translate-x-1 transition-transform">
                    &rarr;
                </span>
            </a>

        </div>

        <!-- Footer -->
        <footer class="pt-8 text-slate-400 text-sm font-medium">
            Developed by Ir. Budhy Prasetyo
        </footer>
    </main>

</body>
</html>
